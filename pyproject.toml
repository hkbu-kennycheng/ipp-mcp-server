[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipp-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for IPP Multi-Printer Management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kam Kong Cheng", email = "kennycheng.hkbu@gmail.com" }
]
dependencies = [
    "fastmcp>=0.1.0",
    "pyipp>=0.11.0",
    "zeroconf>=0.131.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
    "opentelemetry-api>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0"
]

[project.scripts]
ipp-mcp-server = "ipp_mcp_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ipp_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
