[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipp-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for IPP Multi-Printer Management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kam Kong Cheng", email = "kennycheng.hkbu@gmail.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "zeroconf>=0.131.0",
    "pyipp>=0.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0"
]

[project.scripts]
ipp-mcp-server = "ipp_mcp_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F841", "F811", "F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = false
disallow_untyped_defs = false
