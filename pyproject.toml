[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipp-mcp-server"
version = "0.1.0"
description = "Internet Printing Protocol (IPP) Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kam Kong Cheng", email = "kennycheng.hkbu@gmail.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "zeroconf>=0.131.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[project.scripts]
ipp-mcp-server = "ipp_mcp_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::DeprecationWarning"
]

[tool.ruff]
line-length = 120
ignore = ["F841", "F811", "F401", "E501"]

[tool.ruff.lint]
ignore = ["F841", "F811", "F401", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = false
disallow_untyped_defs = false
